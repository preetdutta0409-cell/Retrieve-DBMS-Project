{% extends "base.html" %}{% block title %}Report an item · Retrieve{% endblock %}
{% block content %}<section class="page-wrap"><div class="page-intro"><span class="section-kicker">ADD TO THE COMMUNITY BOARD</span><h1>Let's help it <em>find its way.</em></h1><p>Share the details you know. Keep private identifying details out of the public description.</p></div><form class="form-card wide" method="post" enctype="multipart/form-data"><div class="form-row"><label>I'm reporting <select name="item_type" required><option value="lost">An item I lost</option><option value="found">An item I found</option></select></label><label>Category<select name="category" required>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label></div><label>Item name<input name="title" required maxlength="140" placeholder="e.g. Navy blue backpack"></label><label>Description<textarea name="description" required rows="4" placeholder="Describe the item, colour, brand and visible details..."></textarea></label><div class="form-row"><label>Location<input name="location" required maxlength="180" placeholder="e.g. Main library, second floor"></label><label>Date lost or found<input type="date" name="item_date"></label></div><label>Photo (optional)<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"><small class="help">PNG, JPG or WEBP · Maximum 5 MB</small></label><div class="form-actions"><a class="button secondary" href="{{ url_for('index') }}">Cancel</a><button class="button primary" type="submit">Publish report <span>→</span></button></div></form></section>{% endblock %}
